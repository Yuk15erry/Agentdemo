version: '3.8'

services:
  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=demo
      - DEMO_MODE=true
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data
    command: streamlit run demo/streamlit_app.py --server.port=8501 --server.address=0.0.0.0

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=demo
      - DEMO_MODE=true
    command: uvicorn api.routes:app --host 0.0.0.0 --port 8000
